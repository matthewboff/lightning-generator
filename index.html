<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightning Generator</title>
<meta name="description" content="Free, open-source generator for glowing light-ray, comet and lightning visuals. Dozens of sliders, randomize, export up to 16K. Runs in your browser.">
<meta property="og:title" content="Lightning Generator">
<meta property="og:description" content="Make glowing light-ray and lightning visuals in your browser. Free and open source.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://lightning-generator.vercel.app/examples/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e0e0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0e0f'/%3E%3Cpath d='M18 3 8 18h7l-2 11 11-16h-7z' fill='%232f9be6'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #161617;
    --stage: #0e0e0f;
    --panel: #1d1d1f;
    --raised: #28282b;
    --line: #333337;
    --text: #e9e9ec;
    --dim: #96969d;
    --accent: #2f9be6;
    --on-accent: #000;
    --r: 7px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    display: grid; grid-template-columns: minmax(0, 1fr) 344px; overflow: hidden;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- stage ---------- */
  #stageCol { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; }
  #stage {
    flex: 1; min-height: 0; background: var(--stage);
    display: grid; place-items: center; padding: 28px; position: relative; overflow: hidden;
  }
  #view { display: block; cursor: crosshair; box-shadow: 0 0 0 1px #ffffff14, 0 18px 60px #000a; touch-action: none; }
  #hint { position: absolute; left: 16px; bottom: 12px; color: #ffffff59; font-size: 12px; pointer-events: none; }
  #glError { color: #ff9c8a; max-width: 46ch; white-space: pre-wrap; }

  #bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line);
  }
  #bar label { color: var(--dim); display: flex; align-items: center; gap: 7px; }
  #bar .spacer { flex: 1; }
  .field {
    background: var(--raised); border: 1px solid var(--line); border-radius: var(--r);
    padding: 6px 8px; height: 30px;
  }
  input.num { width: 74px; }
  input.num::-webkit-inner-spin-button { display: none; }
  #status { color: var(--dim); min-width: 12ch; text-align: right; }

  .btn {
    background: var(--raised); border: 1px solid var(--line); border-radius: var(--r);
    height: 30px; padding: 0 12px; white-space: nowrap;
  }
  .btn:hover { background: #323236; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.icon { width: 30px; padding: 0; }

  /* ---------- panel ---------- */
  #panel {
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100vh; min-height: 0;
  }
  #head { padding: 14px 14px 12px; border-bottom: 1px solid var(--line); }
  #head h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  #head .title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 12px; }
  #head .title a { color: var(--dim); font-size: 12px; text-decoration: none; }
  #head .title a:hover { color: var(--text); }
  #head .row { display: flex; gap: 8px; }
  #head .row + .row { margin-top: 8px; }
  #btnRandom { flex: 1; height: 38px; font-size: 14px; }
  #head .row.small .btn { flex: 1; }
  #groups { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 30px; }

  details { border-bottom: 1px solid var(--line); }
  summary {
    list-style: none; display: flex; align-items: center; gap: 8px;
    padding: 11px 14px; cursor: pointer; font-weight: 600; user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--dim); border-bottom: 1.5px solid var(--dim);
    transform: rotate(-45deg); transition: transform .12s; margin-right: 2px;
  }
  details[open] > summary::before { transform: rotate(45deg); }
  summary .grow { flex: 1; }
  .lock {
    border: 0; background: none; color: var(--dim); font-size: 11.5px; padding: 3px 7px; border-radius: 5px; font-weight: 400;
  }
  .lock:hover { background: var(--raised); }
  .lock[aria-pressed="true"] { background: var(--raised); color: var(--text); }
  .body { padding: 0 14px 14px; display: grid; gap: 9px; }

  .ctl { display: grid; grid-template-columns: 106px 1fr 40px 18px; align-items: center; gap: 7px; }
  .pin {
    width: 18px; height: 18px; padding: 0; border: 0; border-radius: 4px; background: none;
    color: var(--dim); opacity: .4; display: grid; place-items: center;
  }
  .pin:hover { opacity: 1; background: var(--raised); }
  .pin[aria-pressed="true"] { opacity: 1; color: var(--accent); }
  .pin svg { width: 12px; height: 12px; display: block; }
  .pin .shackle { transform: translateX(3px) rotate(0deg); transition: transform .12s; }
  .pin[aria-pressed="true"] .shackle { transform: none; }
  .ctl.pinned .name { color: var(--text); }
  .ctl .name { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
  .ctl .val { text-align: right; color: var(--text); }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: none; margin: 0; cursor: ew-resize;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p, 50%), #45454a var(--p, 50%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #f2f2f4; margin-top: -4px;
    box-shadow: 0 0 0 3px var(--panel);
  }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: #45454a; }
  input[type=range]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--accent); }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: #f2f2f4; }

  .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .colors label { display: grid; gap: 5px; color: var(--dim); }
  .colors .cap { display: flex; align-items: center; justify-content: space-between; }
  input[type=color] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 30px; padding: 0;
    border: 1px solid var(--line); border-radius: var(--r); background: none; cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 6px; }
  .palettes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .palettes button {
    height: 24px; border-radius: 6px; border: 1px solid var(--line); padding: 0;
  }
  .palettes button:hover { border-color: #77777f; }
  .note { color: var(--dim); font-size: 12px; margin: 0; }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; overflow: auto; }
    #stageCol { height: 62vh; }
    #panel { height: auto; border-left: 0; border-top: 1px solid var(--line); }
    #groups { overflow: visible; }
  }
</style>
</head>
<body>

<div id="stageCol">
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="hint">Drag on the image to move the light. Double-click a slider name to reset it. Lock a slider to keep it when randomizing.</div>
  </div>
  <div id="bar">
    <label>Size
      <select id="sizePreset" class="field"></select>
    </label>
    <label>
      <input id="outW" class="field num" type="number" min="16" max="16384" step="1" aria-label="Width in pixels">
      ×
      <input id="outH" class="field num" type="number" min="16" max="16384" step="1" aria-label="Height in pixels">
      <button id="btnSwap" class="btn" title="Swap width and height">Rotate</button>
    </label>
    <span class="spacer"></span>
    <span id="status"></span>
    <select id="fmt" class="field" aria-label="File format">
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
    </select>
    <button id="btnExport" class="btn primary">Export image</button>
  </div>
</div>

<aside id="panel">
  <div id="head">
    <div class="title">
      <h1>Lightning Generator</h1>
      <a href="https://github.com/matthewboff/lightning-generator" target="_blank" rel="noopener">Source on GitHub</a>
    </div>
    <div class="row">
      <button id="btnRandom" class="btn primary" title="Shortcut: R">Randomize</button>
      <button id="btnBack" class="btn" title="Go back to the previous look (Z)" disabled>Back</button>
    </div>
    <div class="row small">
      <button id="btnSeed" class="btn" title="Keep every setting, reshuffle the rays (S)">Reshuffle rays</button>
      <button id="btnSave" class="btn" title="Save these settings as a file">Save</button>
      <button id="btnLoad" class="btn" title="Load a saved settings file">Load</button>
      <input id="fileLoad" type="file" accept="application/json,.json" hidden>
    </div>
  </div>
  <div id="groups"></div>
</aside>

<script>
'use strict';

/* ------------------------------------------------------------------ *
 * Parameters. Each becomes a slider and a float uniform named u_<key>.
 * rand: [lo, hi] range used by Randomize. on: chance the layer is on.
 * ------------------------------------------------------------------ */
const GROUPS = [
  { id: 'source', title: 'Light source', open: true, params: [
    ['srcX',      'Position X',      -0.3, 1.3, 0.005, 0.50],
    ['srcY',      'Position Y',      -0.3, 1.3, 0.005, 0.97],
    ['dir',       'Direction',        0,   360, 1,     270],
    ['spread',    'Spread',           10,  360, 1,     125, [50, 200]],
    ['core',      'Core brightness',  0,   4,   0.01,  2.8, [0.8, 3.4]],
    ['coreSize',  'Core size',        0.01,0.6, 0.005, 0.24, [0.08, 0.34]],
    ['coreRag',   'Core raggedness',  0,   1,   0.01,  0.55, [0.1, 0.9]],
  ]},
  { id: 'rays', title: 'Rays', open: true, params: [
    ['beams',     'Brightness',       0,   3,   0.01,  0.85, [0.4, 1.4]],
    ['beamCount', 'Count',            0,   64,  1,     26,   [8, 48]],
    ['beamWidth', 'Width',            0.005,0.4,0.001, 0.11, [0.04, 0.2]],
    ['widthVar',  'Width variation',  0,   1,   0.01,  0.8,  [0.3, 1]],
    ['edge',      'Edge sharpness',   0,   1,   0.01,  0.85, [0.4, 1]],
    ['beamLen',   'Length',           0.1, 3,   0.01,  1.0,  [0.5, 2]],
    ['lenVar',    'Length variation', 0,   1,   0.01,  0.6,  [0.2, 1]],
    ['taper',     'Taper',            0,   1.5, 0.01,  0.35, [0, 0.9]],
    ['curl',      'Curl',             0,   1.5, 0.01,  0.12, [0, 0.5]],
    ['wobble',    'Wobble',           0,   0.6, 0.005, 0.03, [0, 0.06]],
    ['wobbleFreq','Wobble frequency', 0.5, 8,   0.05,  2.0,  [1, 5]],
    ['stri',      'Striations',       0,   1,   0.01,  0.25, [0, 0.6]],
    ['striFreq',  'Striation density',5,   200, 1,     60,   [20, 150]],
  ]},
  { id: 'streaks', title: 'Thin streaks', params: [
    ['streakMix',  'Share of rays',   0,   1,   0.01,  0.35, [0.1, 0.6]],
    ['streakWidth','Thinness',        0.02,0.5, 0.005, 0.10, [0.04, 0.3]],
    ['streakGain', 'Brightness',      0.5, 4,   0.01,  1.8,  [1, 3]],
  ]},
  { id: 'haze', title: 'Haze', params: [
    ['haze',      'Amount',           0,   2,   0.01,  0.45, [0.1, 0.9]],
    ['hazeSize',  'Reach',            0.05,1.5, 0.005, 0.40, [0.2, 0.9]],
    ['hazeTurb',  'Cloudiness',       0,   1,   0.01,  0.5,  [0, 1]],
  ]},
  { id: 'plume', title: 'Plume', params: [
    ['plume',     'Brightness',       0,   4,   0.01,  2.8,  [1.2, 3.4], 0.5],
    ['plumeLen',  'Length',           0.2, 2.5, 0.01,  1.6,  [0.8, 2.2]],
    ['plumeWidth','Width',            0.01,0.3, 0.001, 0.09, [0.04, 0.15]],
    ['plumeWave', 'Waviness',         0,   0.4, 0.005, 0.07, [0.02, 0.18]],
    ['plumeFreq', 'Wave frequency',   0.5, 8,   0.05,  2.6,  [1, 5]],
    ['plumeBlob', 'Blotchiness',      0,   1,   0.01,  0.3,  [0, 0.9]],
  ]},
  { id: 'fil', title: 'Filaments', params: [
    ['fil',       'Brightness',       0,   2,   0.01,  0,    [0.4, 1.2], 0.3],
    ['filCount',  'Count',            0,   8,   1,     4,    [2, 7]],
    ['filX',      'Position X',       0,   1,   0.005, 0.5,  [0.3, 0.7]],
    ['filY',      'Position Y',       0,   1,   0.005, 0.5,  [0.3, 0.7]],
    ['filAngle',  'Angle',            0,   180, 1,     135,  [0, 180]],
    ['filAmp',    'Twist',            0,   0.2, 0.001, 0.05, [0.015, 0.1]],
    ['filFreq',   'Twist frequency',  1,   20,  0.1,   7,    [3, 12]],
    ['filLen',    'Length',           0.1, 1.5, 0.01,  0.8,  [0.4, 1.3]],
    ['filWidth',  'Thickness',        0.3, 5,   0.05,  1.0,  [0.6, 2]],
  ]},
  { id: 'finish', title: 'Finish', open: true, params: [
    ['exposure',  'Exposure',        -3,   3,   0.01,  0,    [-0.5, 0.7]],
    ['contrast',  'Contrast',         0,   1,   0.01,  0.38, [0.25, 0.6]],
    ['black',     'Black point',      0,   0.4, 0.005, 0.04, [0, 0.1]],
    ['sharp',     'Sharpness',        0,   1,   0.01,  0.8,  [0.45, 1]],
    ['vig',       'Vignette',         0,   1,   0.01,  0.2,  [0, 0.5]],
    ['grain',     'Grain',            0,   1,   0.005, 0.3,  [0.12, 0.5]],
    ['grainSize', 'Grain size',       0.5, 5,   0.05,  1.6,  [1, 2.6]],
    ['grainMid',  'Grain in midtones only', 0, 1, 0.01, 0.7, [0.4, 1]],
  ]},
];

const PALETTES = [
  ['Comet',   '#000204', '#0c84d6', '#ffffff', 0.50],
  ['Inverse', '#ffffff', '#12a0d4', '#ffffff', 0.50],
  ['Ember',   '#040100', '#e2501a', '#fff3dc', 0.50],
  ['Violet',  '#03000a', '#7a3df0', '#ffffff', 0.52],
  ['Mint',    '#000403', '#12b98a', '#f4fff9', 0.50],
  ['Rose',    '#060002', '#e8306e', '#fff0f2', 0.50],
  ['Silver',  '#000000', '#8d949c', '#ffffff', 0.50],
  ['Gold',    '#030200', '#d99a16', '#fffbe6', 0.50],
];

const SIZES = [
  ['Story 1080 × 1920', 1080, 1920],
  ['Instagram 1080 × 1350', 1080, 1350],
  ['Portrait 2000 × 2500', 2000, 2500],
  ['Square 2048 × 2048', 2048, 2048],
  ['HD 1920 × 1080', 1920, 1080],
  ['4K 3840 × 2160', 3840, 2160],
  ['Phone 1290 × 2796', 1290, 2796],
  ['Poster 6000 × 9000', 6000, 9000],
];

const PARAMS = GROUPS.flatMap(g => g.params.map(([key, label, min, max, step, def, rand, on]) =>
  ({ key, label, min, max, step, def, rand, on, group: g.id })));
const BY_KEY = Object.fromEntries(PARAMS.map(p => [p.key, p]));

/* ------------------------------ state ------------------------------ */
const state = { seed: 4271, c0: '#000204', c1: '#0c84d6', c2: '#ffffff', midPos: 0.5, w: 1080, h: 1920 };
for (const p of PARAMS) state[p.key] = p.def;
const locks = new Set();   // whole sections kept when randomizing
const pinned = new Set();  // single parameters kept when randomizing
const history = [];

try {
  const saved = JSON.parse(localStorage.getItem('lightning-state') || 'null');
  if (saved) applySnapshot(saved, true);
  for (const k of JSON.parse(localStorage.getItem('lightning-pinned') || '[]')) if (k in state) pinned.add(k);
} catch (e) { /* storage unavailable: start from defaults */ }

function snapshot() { return JSON.parse(JSON.stringify(state)); }
function applySnapshot(s, withSize) {
  for (const k of Object.keys(state)) {
    if (!(k in s)) continue;
    if ((k === 'w' || k === 'h') && !withSize) continue;
    if (typeof s[k] === typeof state[k]) state[k] = s[k];
  }
}
function persist() {
  try { localStorage.setItem('lightning-state', JSON.stringify(state)); } catch (e) {}
}

/* ------------------------------ shader ----------------------------- */
const VERT = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;

const FRAG = `#version 300 es
precision highp float;
precision highp int;
out vec4 outColor;

uniform vec2 u_res;   // full image size in pixels
uniform vec2 u_off;   // origin of the tile being drawn
uniform float u_seed;
uniform vec3 u_c0, u_c1, u_c2;
uniform float u_midPos;
${PARAMS.map(p => `uniform float u_${p.key};`).join('\n')}

const float PI = 3.14159265;
const float TAU = 6.2831853;

uint pcg(uint v){
  uint s = v * 747796405u + 2891336453u;
  uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
float u2f(uint v){ return float(v) * (1.0 / 4294967295.0); }
float rnd(int i, int k){ return u2f(pcg(uint(i) * 7919u + pcg(uint(k) + uint(u_seed) * 2654435u))); }
float hf(float i, float k){ return u2f(pcg(uint(int(i)) + pcg(uint(int(k)) + uint(u_seed)))); }
float h2(vec2 c, float k){ return u2f(pcg(uint(int(c.x)) + pcg(uint(int(c.y)) + pcg(uint(int(k)) + uint(u_seed))))); }

float n1(float x, float k){
  float i = floor(x), f = x - i; f = f * f * (3. - 2. * f);
  return mix(hf(i, k), hf(i + 1., k), f);
}
float fbm1(float x, float k){
  return n1(x, k) * .57 + n1(x * 2.03 + 11., k + 1.) * .29 + n1(x * 4.01 + 23., k + 2.) * .14;
}
float n2(vec2 x, float k){
  vec2 i = floor(x), f = x - i; f = f * f * (3. - 2. * f);
  return mix(mix(h2(i, k), h2(i + vec2(1, 0), k), f.x),
             mix(h2(i + vec2(0, 1), k), h2(i + vec2(1, 1), k), f.x), f.y);
}
float fbm2(vec2 x, float k){
  return n2(x, k) * .55 + n2(x * 2.1 + 5., k + 1.) * .3 + n2(x * 4.3 + 9., k + 2.) * .15;
}
float wrap(float a){ return mod(a + PI, TAU) - PI; }

float filCurve(float u, float A, float f, float ph, float off, float bow, float env){
  return off + A * sin(u * f + ph) * exp(-pow(u / env, 2.)) + bow * u * u;
}

void main(){
  vec2 frag = gl_FragCoord.xy + u_off;
  float s = min(u_res.x, u_res.y);
  float px = 1. / s;
  vec2 p = (frag - .5 * u_res) / s; p.y = -p.y;

  vec2 S = (vec2(u_srcX, u_srcY) - .5) * u_res / s;
  vec2 q = p - S;
  float r = length(q);
  float dirR = radians(u_dir);
  float rel = wrap(atan(q.y, q.x) - dirR);
  float spread = radians(u_spread);
  float soft = pow(1. - u_sharp, 2.) * .06 + px * .75;
  float rr = max(r, .004);

  // --- rays: each has one hard edge and one long soft falloff, like a caustic fold
  float rays = 0.;
  for (int i = 0; i < 64; i++) {
    if (float(i) >= u_beamCount) break;
    float a0 = (rnd(i, 1) - .5) * spread;
    bool thin = rnd(i, 2) < u_streakMix;
    float w = u_beamWidth * mix(1., .15 + 2.2 * pow(rnd(i, 3), 2.), u_widthVar);
    if (thin) w *= u_streakWidth;
    w *= pow(rr / .5, -u_taper);
    float bend = (rnd(i, 4) - .5) * u_curl * r
               + (fbm1(r * u_wobbleFreq + float(i) * 17.3, 10.) - .5) * 2. * u_wobble * smoothstep(0., .25, r);
    float d = wrap(rel - a0 - bend) * (rnd(i, 5) < .5 ? -1. : 1.);
    float blur = soft / rr;
    float wSoft = w + blur;
    float wHard = w * (1. - u_edge) + blur;
    float prof = d > 0. ? exp(-d / wSoft) : exp(-(d * d) / (wHard * wHard));
    prof *= w / wSoft;
    float len = u_beamLen * mix(1., .2 + 1.8 * rnd(i, 6), u_lenVar);
    float fade = exp(-pow(r / len, 1.5));
    float b = .35 + .65 * rnd(i, 7);
    if (thin) b *= u_streakGain;
    rays += prof * fade * b;
  }
  float stri = fbm1(rel * u_striFreq + fbm1(r * 1.5, 40.) * 2., 50.);
  rays *= mix(1., (.3 + 1.4 * smoothstep(.15, .85, stri)), u_stri);

  // --- haze: soft fog around the source
  float win = mix(.2, 1., smoothstep(spread * .5 + .5, spread * .5 - .2, abs(rel)));
  float haze = u_haze * exp(-r / u_hazeSize) * win
             * (.25 + 1.5 * fbm1(rel * 4., 60.))
             * mix(1., fbm2(p * 3.5, 64.) * 2., u_hazeTurb);

  // --- core: blown-out hot spot
  float cs = u_coreSize * (1. + u_coreRag * (fbm1(rel * 5., 70.) - .5) * 1.4);
  float core = u_core * (exp(-pow(r / cs, 2.)) + .25 * exp(-r / cs));

  // --- plume: one thick wandering tendril along the main direction
  float plume = 0.;
  if (u_plume > 0.) {
    vec2 dv = vec2(cos(dirR), sin(dirR));
    float u = dot(q, dv), v = dot(q, vec2(-dv.y, dv.x));
    float t = clamp(1. - u / u_plumeLen, 0., 1.);
    float c = (fbm1(u * u_plumeFreq, 80.) - .5) * 2. * u_plumeWave * smoothstep(0., .3, u);
    float w = u_plumeWidth * pow(t, 1.1) * (.7 + .9 * fbm1(u * u_plumeFreq * 1.7 + 9., 83.)) + soft * .5;
    float blob = mix(1., .15 + 1.7 * fbm1(u * u_plumeFreq * 1.3 + 33., 86.), u_plumeBlob);
    float x = (v - c) / max(w, 1e-4);
    plume = u_plume * (exp(-x * x) + .22 * exp(-abs(x) * .7)) * t * blob * smoothstep(-.05, .05, u);
  }

  // --- filaments: hair-thin lines that twist around each other
  float fil = 0.;
  if (u_fil > 0.) {
    vec2 F = (vec2(u_filX, u_filY) - .5) * u_res / s;
    float fa = radians(u_filAngle);
    vec2 fd = vec2(cos(fa), -sin(fa));
    vec2 fq = p - F;
    float u = dot(fq, fd), v = dot(fq, vec2(-fd.y, fd.x));
    float env = u_filLen * .45;
    float th = u_filWidth * .0011 + soft * .5;
    for (int i = 0; i < 8; i++) {
      if (float(i) >= u_filCount) break;
      float A = u_filAmp * (.4 + .9 * rnd(i, 21)) * (rnd(i, 22) < .5 ? -1. : 1.);
      float f = u_filFreq * (.6 + .8 * rnd(i, 23));
      float ph = rnd(i, 24) * TAU;
      float off = (rnd(i, 25) - .5) * u_filAmp * .8;
      float bow = (rnd(i, 26) - .5) * .35;
      float y0 = filCurve(u, A, f, ph, off, bow, env);
      float y1 = filCurve(u + .002, A, f, ph, off, bow, env);
      float slope = (y1 - y0) / .002;
      float dist = abs(v - y0) / sqrt(1. + slope * slope);
      float mid = (rnd(i, 28) - .5) * u_filLen * .5;
      float b = (.25 + .75 * rnd(i, 27)) * exp(-pow((u - mid) / (u_filLen * .6), 2.));
      fil += (exp(-pow(dist / th, 2.)) + .12 * exp(-dist / (th * 7.))) * b;
    }
    fil *= u_fil;
  }

  float L = core + rays * u_beams + haze + plume + fil;
  L *= exp2(u_exposure);
  L *= 1. - u_vig * smoothstep(.25, 1.05, length(p));
  L = 1. - exp(-L);
  L = max(0., L - u_black) / (1. - u_black);
  L = pow(L, mix(.7, 2.6, u_contrast));

  // --- film grain, applied to light before colouring so it tints like the photos
  vec2 g = frag * (1080. / (s * u_grainSize));
  float gn = (n2(g, 90.) - .5) * 2. + (n2(g * 2.3 + 7., 91.) - .5) * 1.2 + (h2(floor(g * 3.1), 92.) - .5) * .5;
  float midMask = smoothstep(0., .22, L) * (1. - smoothstep(.72, 1., L));
  L = clamp(L + gn * u_grain * .3 * mix(1., midMask * 1.25 + .06, u_grainMid) * (1. - smoothstep(.82, 1., L)), 0., 1.);

  float m = u_midPos;
  vec3 col = L < m ? mix(u_c0, u_c1, smoothstep(0., 1., L / m) * .6 + (L / m) * .4)
                   : mix(u_c1, u_c2, (L - m) / (1. - m));
  outColor = vec4(col, 1.);
}`;

/* ------------------------------- WebGL ------------------------------ */
const canvas = document.getElementById('view');
const stage = document.getElementById('stage');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
let prog, U = {};

function fail(msg) {
  canvas.remove();
  const d = document.createElement('div');
  d.id = 'glError'; d.textContent = msg;
  stage.appendChild(d);
}

function initGL() {
  if (!gl) { fail('This browser has no WebGL 2, which the generator needs. Open the page in a current Chrome, Safari, or Firefox.'); return false; }
  const mk = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, mk(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { fail('The shader did not compile:\n' + e.message); console.error(e); return false; }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['res', 'off', 'seed', 'c0', 'c1', 'c2', 'midPos', ...PARAMS.map(p => p.key)])
    U[n] = gl.getUniformLocation(prog, 'u_' + n);
  return true;
}

const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

function setUniforms(fullW, fullH, offX, offY) {
  gl.uniform2f(U.res, fullW, fullH);
  gl.uniform2f(U.off, offX, offY);
  gl.uniform1f(U.seed, state.seed);
  gl.uniform3fv(U.c0, hexRgb(state.c0));
  gl.uniform3fv(U.c1, hexRgb(state.c1));
  gl.uniform3fv(U.c2, hexRgb(state.c2));
  gl.uniform1f(U.midPos, state.midPos);
  for (const p of PARAMS) gl.uniform1f(U[p.key], state[p.key]);
}

let queued = false, exporting = false;
function render() {
  if (queued || exporting || !prog) return;
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    if (exporting) return;
    fitPreview();
    gl.viewport(0, 0, canvas.width, canvas.height);
    setUniforms(canvas.width, canvas.height, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  });
}

// Preview is drawn at screen resolution (never larger than the export itself).
function fitPreview() {
  const pad = 56;
  const availW = Math.max(50, stage.clientWidth - pad), availH = Math.max(50, stage.clientHeight - pad);
  const k = Math.min(availW / state.w, availH / state.h);
  const cssW = Math.round(state.w * k), cssH = Math.round(state.h * k);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.min(state.w, Math.round(cssW * dpr)), ph = Math.min(state.h, Math.round(cssH * dpr));
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
}

/* ------------------------------ export ------------------------------ */
const statusEl = document.getElementById('status');

async function exportImage() {
  if (exporting || !prog) return;
  const W = state.w, H = state.h, fmt = document.getElementById('fmt').value;
  exporting = true;
  document.getElementById('btnExport').disabled = true;
  try {
    const out = document.createElement('canvas');
    out.width = W; out.height = H;
    const ctx = out.getContext('2d');
    if (!ctx || out.width !== W || out.height !== H) throw new Error('too-big');
    // Draw in tiles so sizes beyond the GPU's single-canvas limit still work.
    const T = 2048, total = Math.ceil(W / T) * Math.ceil(H / T);
    let done = 0;
    for (let ty = 0; ty < H; ty += T) {
      for (let tx = 0; tx < W; tx += T) {
        const tw = Math.min(T, W - tx), th = Math.min(T, H - ty);
        canvas.width = tw; canvas.height = th;
        gl.viewport(0, 0, tw, th);
        setUniforms(W, H, tx, ty);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        ctx.drawImage(canvas, 0, 0, tw, th, tx, H - ty - th, tw, th);
        statusEl.textContent = `Exporting ${Math.round(++done / total * 100)}%`;
        await new Promise(r => setTimeout(r, 0));
      }
    }
    const blob = await new Promise(r => out.toBlob(r, 'image/' + fmt, 0.95));
    if (!blob) throw new Error('too-big');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `lightning-${state.seed}-${W}x${H}.${fmt === 'jpeg' ? 'jpg' : 'png'}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    statusEl.textContent = `Exported ${W} × ${H}`;
  } catch (e) {
    console.error(e);
    statusEl.textContent = e.message === 'too-big'
      ? `${W} × ${H} is larger than this browser can save. Try a smaller size.`
      : 'Export failed. See the console for details.';
  } finally {
    exporting = false;
    document.getElementById('btnExport').disabled = false;
    canvas.width = 0; // force the preview to resize and redraw
    render();
  }
}

/* -------------------------------- UI -------------------------------- */
const sliders = {};
const groupsEl = document.getElementById('groups');

function fmtVal(p, v) {
  if (p.step >= 1) return String(Math.round(v));
  return v.toFixed(p.step >= 0.05 ? 2 : p.step >= 0.005 ? 2 : 3);
}
function syncSlider(p) {
  const s = sliders[p.key];
  s.input.value = state[p.key];
  s.input.style.setProperty('--p', ((state[p.key] - p.min) / (p.max - p.min) * 100) + '%');
  s.val.textContent = fmtVal(p, state[p.key]);
}

function buildColorGroup() {
  const d = document.createElement('details');
  d.open = true;
  d.innerHTML = `<summary><span class="grow">Color</span>
      <button class="lock" data-lock="color" aria-pressed="false" title="Keep these when randomizing">Keep</button></summary>
    <div class="body">
      <div class="colors">
        <label><span class="cap">Background${pinButton('c0', 'Background')}</span><input type="color" id="c0"></label>
        <label><span class="cap">Glow${pinButton('c1', 'Glow')}</span><input type="color" id="c1"></label>
        <label><span class="cap">Hot spot${pinButton('c2', 'Hot spot')}</span><input type="color" id="c2"></label>
      </div>
      <div class="palettes" id="palettes"></div>
      <div class="ctl" id="midRow"></div>
    </div>`;
  groupsEl.appendChild(d);
  for (const k of ['c0', 'c1', 'c2']) {
    d.querySelector('#' + k).addEventListener('input', e => { state[k] = e.target.value; changed(); });
  }
  const pal = d.querySelector('#palettes');
  for (const [name, a, b, c, m] of PALETTES) {
    const btn = document.createElement('button');
    btn.title = name; btn.setAttribute('aria-label', name + ' palette');
    btn.style.background = `linear-gradient(to right, ${a}, ${b} ${m * 100}%, ${c})`;
    btn.addEventListener('click', () => {
      pushHistory();
      Object.assign(state, { c0: a, c1: b, c2: c, midPos: m });
      syncAll(); changed();
    });
    pal.appendChild(btn);
  }
  const mid = { key: 'midPos', label: 'Glow position', min: 0.15, max: 0.85, step: 0.01, def: 0.5 };
  BY_KEY.midPos = mid;
  addSlider(d.querySelector('#midRow'), mid);
}

const LOCK_SVG = `<svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
  <path class="shackle" d="M3.5 5.5V3.75a2.5 2.5 0 0 1 5 0V5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="2" y="5.5" width="8" height="5.5" rx="1.3" fill="currentColor"/></svg>`;
function pinButton(key, label) {
  const on = pinned.has(key);
  return `<button class="pin" data-pin="${key}" aria-pressed="${on}" aria-label="Lock ${label}"
    title="Lock: Randomize will not change this">${LOCK_SVG}</button>`;
}

function addSlider(row, p) {
  row.innerHTML = `<span class="name" title="${p.label}">${p.label}</span>
    <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" aria-label="${p.label}">
    <span class="val"></span>${pinButton(p.key, p.label)}`;
  row.classList.toggle('pinned', pinned.has(p.key));
  const input = row.querySelector('input'), val = row.querySelector('.val');
  sliders[p.key] = { input, val };
  input.addEventListener('pointerdown', pushHistory);
  input.addEventListener('input', () => { state[p.key] = parseFloat(input.value); syncSlider(p); changed(); });
  row.querySelector('.name').addEventListener('dblclick', () => {
    pushHistory(); state[p.key] = p.def; syncSlider(p); changed();
  });
}

function buildUI() {
  buildColorGroup();
  for (const g of GROUPS) {
    const d = document.createElement('details');
    d.open = !!g.open;
    d.innerHTML = `<summary><span class="grow">${g.title}</span>
      <button class="lock" data-lock="${g.id}" aria-pressed="false" title="Keep these when randomizing">Keep</button></summary>`;
    const body = document.createElement('div');
    body.className = 'body';
    for (const [key] of g.params) {
      const row = document.createElement('div');
      row.className = 'ctl';
      body.appendChild(row);
      addSlider(row, BY_KEY[key]);
    }
    d.appendChild(body);
    groupsEl.appendChild(d);
  }
  groupsEl.addEventListener('click', e => {
    const pin = e.target.closest('.pin');
    if (pin) {
      e.preventDefault();
      const k = pin.dataset.pin;
      pinned.has(k) ? pinned.delete(k) : pinned.add(k);
      pin.setAttribute('aria-pressed', pinned.has(k));
      pin.closest('.ctl')?.classList.toggle('pinned', pinned.has(k));
      try { localStorage.setItem('lightning-pinned', JSON.stringify([...pinned])); } catch (err) {}
      return;
    }
    const b = e.target.closest('.lock');
    if (!b) return;
    e.preventDefault();
    const id = b.dataset.lock;
    locks.has(id) ? locks.delete(id) : locks.add(id);
    b.setAttribute('aria-pressed', locks.has(id));
    b.textContent = locks.has(id) ? 'Kept' : 'Keep';
  });

  const sel = document.getElementById('sizePreset');
  sel.innerHTML = SIZES.map((s, i) => `<option value="${i}">${s[0]}</option>`).join('') + '<option value="custom">Custom</option>';
  sel.addEventListener('change', () => {
    if (sel.value === 'custom') return;
    const [, w, h] = SIZES[sel.value];
    state.w = w; state.h = h; syncSize(); changed();
  });
  for (const [id, k] of [['outW', 'w'], ['outH', 'h']]) {
    document.getElementById(id).addEventListener('change', e => {
      state[k] = Math.max(16, Math.min(16384, Math.round(+e.target.value || 16)));
      syncSize(); changed();
    });
  }
  document.getElementById('btnSwap').addEventListener('click', () => {
    [state.w, state.h] = [state.h, state.w]; syncSize(); changed();
  });
  document.getElementById('btnExport').addEventListener('click', exportImage);
  document.getElementById('btnRandom').addEventListener('click', randomize);
  document.getElementById('btnSeed').addEventListener('click', reshuffle);
  document.getElementById('btnBack').addEventListener('click', back);
  document.getElementById('btnSave').addEventListener('click', saveSettings);
  document.getElementById('btnLoad').addEventListener('click', () => document.getElementById('fileLoad').click());
  document.getElementById('fileLoad').addEventListener('change', loadSettings);

  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range') return;
    const k = e.key.toLowerCase();
    if (k === 'r') randomize();
    else if (k === 's') reshuffle();
    else if (k === 'z') back();
  });

  // Drag on the image to place the light source.
  const place = e => {
    const r = canvas.getBoundingClientRect();
    const cl = v => Math.round(Math.max(-0.3, Math.min(1.3, v)) * 200) / 200;
    state.srcX = cl((e.clientX - r.left) / r.width);
    state.srcY = cl((e.clientY - r.top) / r.height);
    syncSlider(BY_KEY.srcX); syncSlider(BY_KEY.srcY); changed();
  };
  canvas.addEventListener('pointerdown', e => { pushHistory(); canvas.setPointerCapture(e.pointerId); place(e); });
  canvas.addEventListener('pointermove', e => { if (canvas.hasPointerCapture(e.pointerId)) place(e); });

  new ResizeObserver(render).observe(stage);
}

function syncSize() {
  document.getElementById('outW').value = state.w;
  document.getElementById('outH').value = state.h;
  const i = SIZES.findIndex(s => s[1] === state.w && s[2] === state.h);
  document.getElementById('sizePreset').value = i < 0 ? 'custom' : i;
}
function syncAll() {
  for (const k in sliders) syncSlider(BY_KEY[k]);
  for (const k of ['c0', 'c1', 'c2']) document.getElementById(k).value = state[k];
  syncSize();
  syncAccent();
}
// The interface borrows its accent from the image's glow colour.
function syncAccent() {
  let [r, g, b] = hexRgb(state.c1);
  let lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  if (lum < 0.22) { const k = 0.22 - lum; r += k * 1.6; g += k * 1.6; b += k * 1.6; lum = 0.3; }
  const to = v => Math.round(Math.min(1, v) * 255);
  document.documentElement.style.setProperty('--accent', `rgb(${to(r)}, ${to(g)}, ${to(b)})`);
  document.documentElement.style.setProperty('--on-accent', lum > 0.45 ? '#000' : '#fff');
}
function changed() { syncAccent(); persist(); render(); }

/* ---------------------- history, randomize, files ---------------------- */
function pushHistory() {
  const s = JSON.stringify(state);
  if (history[history.length - 1] === s) return;
  history.push(s);
  if (history.length > 60) history.shift();
  document.getElementById('btnBack').disabled = false;
}
function back() {
  const cur = JSON.stringify(state);
  let s;
  while (history.length && (s = history.pop()) === cur) s = null;
  document.getElementById('btnBack').disabled = history.length === 0;
  if (!s) return;
  applySnapshot(JSON.parse(s), false);
  syncAll(); changed();
}
const newSeed = () => 1 + Math.floor(Math.random() * 99998);
function reshuffle() { pushHistory(); state.seed = newSeed(); changed(); }

function hsl(h, s, l) {
  const f = n => {
    const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}

function randomize() {
  pushHistory();
  const R = (a, b) => a + Math.random() * (b - a);
  const snap = p => Math.round(Math.max(p.min, Math.min(p.max, state[p.key])) / p.step) * p.step;
  const held = Object.fromEntries([...pinned].map(k => [k, state[k]]));
  const restore = () => Object.assign(state, held);
  state.seed = newSeed();

  for (const p of PARAMS) {
    if (locks.has(p.group) || !p.rand) continue;
    state[p.key] = p.on !== undefined && Math.random() > p.on ? 0 : R(p.rand[0], p.rand[1]);
  }

  if (!locks.has('source')) {
    // Put the source on or just past an edge and aim it back into the frame.
    const edge = Math.floor(Math.random() * 4), t = R(0.1, 0.9), o = R(-0.12, 0.1);
    [state.srcX, state.srcY] = [[t, 1 - o], [t, o], [o, t], [1 - o, t]][edge];
    restore(); // aim from a locked position, not the discarded random one
    const aspect = state.w / state.h;
    const tx = R(0.35, 0.65), ty = R(0.35, 0.65);
    const ang = Math.atan2(ty - state.srcY, (tx - state.srcX) * aspect) * 180 / Math.PI;
    state.dir = (ang + R(-18, 18) + 360) % 360;
    // Now and then: a dim, far-off source that leaves only veils of light.
    if (Math.random() < 0.25) { state.core *= 0.25; state.coreSize *= 0.6; }
  }
  if (!locks.has('rays') && Math.random() < 0.3) { state.beamWidth *= 1.8; state.edge = R(0.2, 0.7); state.curl = R(0.3, 1.0); }

  if (!locks.has('color')) {
    const roll = Math.random();
    if (roll < 0.45) {
      const hue = R(185, 225);
      Object.assign(state, { c0: hsl(hue, 0.9, 0.008), c1: hsl(hue - 8, R(0.8, 0.95), R(0.4, 0.5)), c2: '#ffffff' });
    } else if (roll < 0.88) {
      const hue = R(0, 360);
      Object.assign(state, { c0: hsl(hue, 0.8, 0.01), c1: hsl(hue, R(0.7, 0.95), R(0.42, 0.55)), c2: hsl(hue + 20, 1, 0.97) });
    } else {
      Object.assign(state, { c0: '#ffffff', c1: hsl(R(0, 360), R(0.7, 0.9), R(0.42, 0.5)), c2: '#ffffff' });
    }
    state.midPos = R(0.42, 0.6);
  }

  for (const p of PARAMS) state[p.key] = +snap(p).toFixed(4);
  state.midPos = +state.midPos.toFixed(2);
  restore();
  syncAll(); changed();
}

function saveSettings() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
  a.download = `lightning-${state.seed}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function loadSettings(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const s = JSON.parse(await file.text());
    pushHistory();
    applySnapshot(s, true);
    syncAll(); changed();
    statusEl.textContent = 'Settings loaded';
  } catch (err) {
    statusEl.textContent = 'That file is not a saved settings file.';
  }
}

/* -------------------------------- start ------------------------------- */
buildUI();
syncAll();
if (initGL()) render();
</script>
</body>
</html>
